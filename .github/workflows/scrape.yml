name: Scrape & Transform

on:
  schedule:
    - cron: '0 */2 * * *' # every 2 hours
  workflow_dispatch:      # Manual trigger for debugging

jobs:
  scrape-and-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT }}'

      - name: Run scraper → GCS
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        run: python src/scraper/main.py

      - name: Run dbt models (Silver + Gold)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET_NAME: ${{ secrets.BQ_DATASET_NAME }}
        run: |
          cd dbt
          dbt run --profiles-dir . --profile news_platform

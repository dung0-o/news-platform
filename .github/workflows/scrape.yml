name: Scrape & Transform

timeout-minutes: 30

on:
  schedule:
    - cron: '0 */2 * * *' # every 2 hours
  workflow_dispatch:      # Manual trigger for debugging

jobs:
  scrape-and-transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create GCP service account key file
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp-key.json

      - name: Run scraper → GCS
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: python src/scraper/main.py

      - name: Run dbt models (Silver + Gold)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_DATASET_NAME: ${{ secrets.BQ_DATASET_NAME }}
        run: |
          cd dbt
          dbt run --profiles-dir . --profile news_platform
